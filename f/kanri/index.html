<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>案件管理｜株式会社マネージメントアドバイザーズ</title>
<link rel="icon" href="../assets/logo-32.png">
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1f1d1a;--sub:#6b655d;--line:#e6e0d8;--or:#e8771e;--or2:#fde7d3;--red:#d93025;--red2:#fde4e1;--amb:#c77800;--amb2:#fff1d6;--grn:#1e8e3e;--grn2:#e3f4e8;--blu:#1a67d2;--blu2:#e4eefc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
/* ログイン */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
#login h1{margin:0 0 4px;font-size:18px}
#login p{margin:0 0 20px;color:var(--sub);font-size:12px}
label.f{display:block;margin:0 0 14px;font-size:12px;color:var(--sub)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:15px}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--red);font-size:12px;min-height:18px;margin:0 0 8px}
/* 上部 */
header{position:sticky;top:0;z-index:20;background:#1f1d1a;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header h1{margin:0;font-size:15px;font-weight:700;flex:1;min-width:160px}
header h1 small{display:block;font-weight:400;font-size:11px;opacity:.6}
header .who{font-size:12px;opacity:.85}
header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
#alarm{display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--red);color:#fff;font-weight:700}
#alarm.on{display:flex;animation:blink 1.2s ease-in-out infinite}
#alarm .btn{background:#fff;color:var(--red);border:0;margin-left:auto}
@keyframes blink{50%{background:#b3241b}}
main{max-width:1280px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--or)}
/* 集計 */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:0 0 14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.tile b{display:block;font-size:26px;line-height:1.1}
.tile span{font-size:12px;color:var(--sub)}
.tile.red b{color:var(--red)} .tile.amb b{color:var(--amb)} .tile.blu b{color:var(--blu)} .tile.grn b{color:var(--grn)}
.tile.on{outline:2px solid var(--or)}
.tile.red.hot{background:var(--red2);border-color:#f3b5ae}
/* 絞り込み */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.filters input[type=search],.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.filters input[type=search]{flex:1;min-width:180px}
.filters label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
.count{font-size:12px;color:var(--sub);margin-left:auto}
/* 一覧 */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:6px 1.3fr 1.4fr 1fr 1.5fr 150px;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:#cfc6ba;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.row .bar{align-self:stretch;border-radius:12px 0 0 12px;background:#d7d0c6}
.row.s-red .bar{background:var(--red)} .row.s-amb .bar{background:var(--amb)} .row.s-done .bar{background:var(--grn)} .row.s-act .bar{background:var(--blu)}
.row.s-red{background:#fffafa}
.row.s-done{opacity:.72}
.no{font-size:11px;color:var(--sub)}
.nm{font-weight:700;font-size:15px}
.co{font-size:12px;color:var(--sub)}
.cat{font-size:12px;color:var(--sub)}
.cat b{display:block;color:var(--ink);font-size:13px}
.subs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.subs i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;background:#f1ede7;color:#5a544c}
.pt{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid}
.pt::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pt.none{color:#8a8178;border-style:dashed}
.steps{display:flex;align-items:center;gap:0}
.steps i{flex:1;height:6px;background:#e8e3dc;margin-right:3px;border-radius:3px}
.steps i.done{background:var(--or)}
.steps i.cur{background:var(--or);box-shadow:0 0 0 2px var(--or2)}
.st{display:flex;justify-content:space-between;font-size:12px;margin-top:5px}
.st b{font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.b-new{background:var(--or);color:#fff}
.b-red{background:var(--red);color:#fff}
.b-amb{background:var(--amb2);color:var(--amb)}
.b-blu{background:var(--blu2);color:var(--blu)}
.b-grn{background:var(--grn2);color:var(--grn)}
.b-gry{background:#eee;color:#666}
.age{text-align:right}
.age .t{display:block;font-weight:700;font-size:13px}
.age .t.red{color:var(--red)} .age .t.amb{color:var(--amb)}
.age small{display:block;font-size:11px;color:var(--sub)}
.empty{padding:40px;text-align:center;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:12px}
/* 詳細 */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
#detail{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:31;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
#detail .dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:flex-start;gap:10px;z-index:2}
#detail .dh h2{margin:0;font-size:17px;flex:1}
#detail .dh h2 small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.x{border:0;background:#f1ede7;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.sec{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 16px;padding:14px 16px}
.sec h3{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:700}
.big-steps{display:flex;gap:4px;flex-wrap:wrap}
.big-steps button{flex:1 1 auto;min-width:72px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--sub)}
.big-steps button.done{background:var(--or2);border-color:#f3c79d;color:#a4500f}
.big-steps button.cur{background:var(--or);border-color:var(--or);color:#fff}
.big-steps button.drop.cur{background:#666;border-color:#666}
dl.info{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;margin:0;font-size:13px}
dl.info dt{color:var(--sub)}
dl.info dd{margin:0;word-break:break-all}
dl.info a{color:var(--blu)}
pre.msg{white-space:pre-wrap;margin:0;font:inherit;font-size:13px;background:#faf8f5;border-radius:8px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--sub);margin:4px 0 10px}
.warnbox{background:var(--amb2);color:#7a4a00;border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 10px}
.redbox{background:var(--red2);color:#a1231a;border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 10px;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 18px;border-left:2px solid var(--line);margin-left:6px}
.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:#cfc6ba}
.tl li.sent::before{background:var(--grn)}
.tl li.prog::before{background:var(--or)}
.tl .h{font-size:12px;color:var(--sub)}
.tl .c{white-space:pre-wrap;font-size:13px}
/* 第5版 */
.big-steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.big-steps button{min-width:0;padding:7px 4px;font-size:12px}
.big-steps button.wait.cur{background:#7b5ea7;border-color:#7b5ea7}
.cands{display:flex;flex-direction:column;gap:8px}
.cand{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fdfcfa}
.cand.top{border-color:#f3c79d;background:#fffaf4}
.cand .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cand .hd b{font-size:14px}
.cand .sc{margin-left:auto;font-size:12px;color:var(--sub)}
.cand .meter{height:5px;background:#eee;border-radius:3px;margin:6px 0}
.cand .meter i{display:block;height:100%;background:var(--or);border-radius:3px}
.cand ul{margin:4px 0 8px;padding-left:1.2em;font-size:12px;color:#5a544c}
.cand .acts{justify-content:flex-start}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chiprow button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px}
.chiprow button.on{background:var(--or);border-color:var(--or);color:#fff}
.money{display:none}.money.on{display:block}
.row.s-wait .bar{background:#7b5ea7}
.b-pur{background:#efe7fb;color:#6a4c99}
.b-yel{background:var(--amb2);color:var(--amb)}
table.pt-tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:13px}
table.pt-tbl th,table.pt-tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.pt-tbl th{background:#faf8f5;font-size:12px;color:var(--sub)}
table.pt-tbl tr.off{opacity:.5}
table.pt-tbl td small{display:block;color:var(--sub);font-size:11px}
.pt-head{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
/* 報告文 */
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#fff;border-radius:14px;width:min(680px,100%);max-height:94vh;overflow:auto;padding:20px}
#modal h3{margin:0 0 4px;font-size:16px}
#modal textarea{min-height:300px;font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f1d1a;color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-size:13px}
/* 振分け先の設定 */
table.rt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
table.rt th,table.rt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.rt th{background:#faf8f5;font-size:12px;color:var(--sub)}
table.rt td.g{background:#fdf6ee;font-weight:700}
table.rt input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
table.rt input.ch{border-color:var(--or);background:#fffaf4}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;justify-content:flex-end}
@media(max-width:900px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .row{grid-template-columns:6px 1fr auto;gap:6px 12px;padding:12px 12px 12px 0}
  .row .bar{grid-row:1/5}
  .row>.c1{grid-column:2}
  .row>.age{grid-column:3;grid-row:1}
  .row>.c2,.row>.c3,.row>.c4{grid-column:2/4}
  .grid2{grid-template-columns:1fr}
  table.rt .hm{display:none}
  table.pt-tbl .hm{display:none}
}
@media(max-width:520px){header{gap:6px 8px;padding:8px 12px}header h1{font-size:14px}header h1 small{display:none}header .btn{padding:5px 8px;font-size:11px}#alarm{font-size:12px;padding:8px 12px}#alarm .btn{white-space:nowrap}main{padding:12px}.tiles{grid-template-columns:repeat(3,1fr);gap:6px}.tile{padding:8px 10px}.tile b{font-size:20px}.tile span{font-size:11px}.filters input[type=search]{flex-basis:100%}.filters select{flex:1;min-width:0}.sec{margin:10px}}
</style>
</head>
<body>

<div id="login">
  <form id="lf" autocomplete="on">
    <h1>案件管理画面</h1>
    <p>株式会社マネージメントアドバイザーズ</p>
    <label class="f">ログインID<input id="lid" name="username" autocomplete="username" required></label>
    <label class="f">パスワード<input id="lpw" name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lerr"></p>
    <button class="btn pri" style="width:100%" id="lbtn">ログイン</button>
  </form>
</div>

<div id="app" class="hide">
  <header>
    <h1>案件管理<small>株式会社マネージメントアドバイザーズ</small></h1>
    <span class="who" id="upd"></span>
    <button class="btn sm" id="snd" title="警告音の入／切">🔔 音：入</button>
    <span class="who" id="me"></span>
    <button class="btn sm" id="pwb">パスワード変更</button>
    <button class="btn sm" id="out">ログアウト</button>
  </header>
  <div id="alarm"><span id="alarmText"></span><button class="btn sm" id="alarmGo">要対応を表示</button></div>
  <main>
    <div class="tabs"><button class="on" data-tab="cases">案件一覧</button><button data-tab="partners">取次先の登録</button></div>
    <section id="cases">
      <div class="tiles" id="tiles"></div>
      <div class="filters">
        <input type="search" id="q" placeholder="名前・会社・番号・内容で探す">
        <select id="fs"><option value="">すべての進み具合</option></select>
        <select id="fp"><option value="">すべての取次先</option></select>
        <select id="fa"><option value="">すべての担当者</option><option value="-">担当者なし</option></select>
        <label><input type="checkbox" id="fd"> 完了も表示</label>
        <span class="count" id="cnt"></span>
      </div>
      <div class="list" id="list"></div>
    </section>
    <section id="partners" class="hide">
      <div class="pt-head"><p class="note" style="margin:0;flex:1">取次先を登録すると、お問い合わせの内容から合う取次先が「取次の候補」として自動で出ます。「対応分野」と「得意なこと・キーワード」を入れるほど、候補の精度が上がります。</p><button class="btn pri" id="ptadd">＋ 取次先を登録</button></div>
      <div id="ptlist"></div>
    </section>
  </main>
</div>

<div id="shade" class="hide"></div>
<aside id="detail" class="hide"></aside>
<div id="modal" class="hide"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var h=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var S={token:null,data:null,filter:{tile:''},open:null,alerts:{},lastChime:0,sound:true,known:null};
try{S.token=sessionStorage.getItem('ma-adm');S.sound=localStorage.getItem('ma-adm-snd')!=='0'}catch(_){}

// サーバーの呼び出し
var GAS='https://script.google.com/macros/s/AKfycbzepmv2nhstu4cCZT6eGkV7mOzPnPS5l5haTXulbpYSzf_-qIoIKs9A8dKfcuJYxNjVWw/exec';
function call(fn){var args=Array.prototype.slice.call(arguments,1);
  return fetch(GAS,{method:'POST',body:new URLSearchParams({api:fn,args:JSON.stringify(args)})})
  .catch(function(){throw new Error('通信できませんでした。インターネットの接続を確認して、もう一度お試しください。')})
  .then(function(r){return r.json()}).then(function(j){if(j&&j.apiError){if(/ログインの有効時間/.test(j.apiError)){logoutLocal();}throw new Error(j.apiError)}return j?j.r:null})}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}

// ---- 音（警告音・新着音） ----
var AC=null;function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(_){}return AC}
function tone(f,t0,d,vol){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);var t=a.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.05)}
function chimeAlert(){if(!S.sound)return;[0,.32,.64].forEach(function(t){tone(880,t,.25,.3);tone(660,t+.14,.22,.25)})}
function chimeNew(){if(!S.sound)return;tone(784,0,.5,.22);tone(1047,.18,.7,.22)}

document.addEventListener('pointerdown',function(){ac()},{once:true});
// ---- ログイン ----
$('#lf').addEventListener('submit',function(e){e.preventDefault();ac();var b=$('#lbtn');b.disabled=true;$('#lerr').textContent='';
  call('login',$('#lid').value,$('#lpw').value).then(function(r){b.disabled=false;
    if(!r.ok){$('#lerr').textContent=r.error;return}
    S.token=r.token;try{sessionStorage.setItem('ma-adm',r.token)}catch(_){}
    $('#lpw').value='';start()}).catch(function(e){b.disabled=false;$('#lerr').textContent=e.message})});
function logoutLocal(){S.token=null;try{sessionStorage.removeItem('ma-adm')}catch(_){}clearInterval(S.timer);$('#app').classList.add('hide');$('#login').classList.remove('hide');closeDetail();$('#lerr').textContent='ログインしてください。'}
$('#out').addEventListener('click',function(){call('logout',S.token).catch(function(){});logoutLocal();$('#lerr').textContent=''});
$('#snd').addEventListener('click',function(){S.sound=!S.sound;try{localStorage.setItem('ma-adm-snd',S.sound?'1':'0')}catch(_){}sndLabel();if(S.sound)chimeNew()});
function sndLabel(){$('#snd').textContent=S.sound?'🔔 音：入':'🔕 音：切'}
$('#pwb').addEventListener('click',function(){
  modal('<h3>パスワード変更</h3><p class="note">8文字以上にしてください。</p><label class="f">今のパスワード<input type="password" id="p0" autocomplete="current-password"></label><label class="f">新しいパスワード<input type="password" id="p1" autocomplete="new-password"></label><label class="f">新しいパスワード（確認）<input type="password" id="p2" autocomplete="new-password"></label><p class="err" id="perr"></p><div class="acts"><button class="btn" data-close>やめる</button><button class="btn pri" id="pok">変更する</button></div>');
  $('#pok').onclick=function(){if($('#p1').value!==$('#p2').value){$('#perr').textContent='確認用と一致しません。';return}
    call('changePassword',S.token,$('#p0').value,$('#p1').value).then(function(r){if(!r.ok){$('#perr').textContent=r.error;return}closeModal();toast('パスワードを変更しました')}).catch(function(e){$('#perr').textContent=e.message})}});

function start(){$('#login').classList.add('hide');$('#app').classList.remove('hide');sndLabel();load(true);clearInterval(S.timer);S.timer=setInterval(function(){load(false)},60000)}

// ---- 読み込み ----
function load(first){return call('listCases',S.token).then(function(d){
  var prev=S.known;S.data=d;$('#me').textContent=d.me.名前+' さん';$('#upd').textContent='更新 '+d.時刻.slice(11);
  // 新着
  var ids={};d.案件.forEach(function(c){ids[c.番号]=1});
  if(prev){var nw=d.案件.filter(function(c){return !prev[c.番号]});if(nw.length){chimeNew();toast('新しいお問い合わせが '+nw.length+' 件届きました')}}
  S.known=ids;
  if(first)fillSelects();
  render();alarm();
  if(S.open){var c=find(S.open);if(c&&!$('#detail').contains(document.activeElement))renderDetail(c,true)}

function hours(n){n=Math.max(0,n|0);return n>=24?Math.floor(n/24)+'日'+(n%24?(n%24)+'時間':''):n+'時間'}
function hue(s){var x=0;for(var i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))%360;return x}
function partner(p){return String(p||'').split('／').map(function(x){
  if(/未設定|未割当/.test(x))return '<span class="pt none">'+h(x)+'</span>';
  var c=hue(x);return '<span class="pt" style="color:hsl('+c+',65%,36%);background:hsl('+c+',80%,96%);border-color:hsl('+c+',55%,82%)">'+h(x)+'</span>'}).join(' ')}
function level(c){if(c.警告==='未対応')return 'red';if(c.警告)return 'amb';if(!c.進行中)return 'done';if(c.待機)return 'wait';if(c.状況==='未対応')return 'red';return 'act'}
function stepsBar(c){var st=S.data.段階,i=st.indexOf(c.状況);
  return '<div class="steps" title="'+h(c.状況)+'">'+st.map(function(_,k){return '<i class="'+(k<i?'done':k===i?'cur':'')+'"></i>'}).join('')+'</div>'}
function statusBadge(c){var cls=c.状況==='未対応'?'b-red':c.状況==='完了'?'b-grn':c.待機?'b-pur':c.お金?'b-yel':'b-blu';
  return '<span class="badge '+cls+'">'+h(c.状況)+(c.進捗中?'・'+h(c.進捗中):'')+'</span>'}
function ageHtml(c){
  if(!c.進行中)return '<span class="t" style="color:var(--sub)">完了</span><small>'+h(c.最終対応.slice(0,10))+'</small>';
  if(c.待機&&!c.警告)return '<span class="t" style="color:#6a4c99">次回アプローチ</span><small>'+(c.期日?'予定日 '+h(c.期日):'予定日なし')+'</small>';
  var cls=c.警告==='未対応'||c.状況==='未対応'?'red':c.警告?'amb':'';
  var lab=c.状況==='未対応'?'未対応 ':'放置 ';
  return '<span class="t '+cls+'">'+lab+hours(c.放置時間)+'</span><small>'+(c.警告?'⚠ '+h(c.警告):'最終対応 '+h(c.最終対応.slice(5)))+'</small>'+(c.期日?'<small>期日 '+h(c.期日)+'</small>':'')+(c.連絡めやす?'<small style="color:var(--blu)">✉ 連絡 '+hours(c.連絡からの時間)+'なし</small>':'')}

    return true})}

function reload(){return load(false).then(function(){var c=find(S.open);if(c)renderDetail(c,false)})}

// ---- 報告文の確認と送信 ----
function modal(html){var m=$('#modal');m.innerHTML='<div class="box">'+html+'</div>';m.classList.remove('hide');$$('[data-close]',m).forEach(function(b){b.onclick=closeModal})}
function closeModal(){$('#modal').classList.add('hide');$('#modal').innerHTML=''}
function reportModal(c,st,dr){
  var tooSoon=c.最終報告&&dr.連絡からの時間<dr.下限;
  modal('<h3>お客さまへの進捗報告（下書き）</h3><p class="note">宛先：'+h(dr.宛先)+'　／　作り方：'+h(dr.方法)+'　／　前回の連絡：'+h(dr.前回連絡)+'　／　これまでの報告：'+dr.報告回数+' 回</p>'
   +(tooSoon?'<div class="warnbox">前回の連絡から '+hours(dr.連絡からの時間)+' しかたっていません。連絡が多すぎないか確認してください。急ぎでなければ、次の区切りでまとめて送るのがおすすめです。</div>':'')
   +'<label class="f">返信する担当者（文中の名前・差出人名が変わります）<select id="mt">'+dr.担当一覧.map(function(s){return '<option'+(s===dr.担当?' selected':'')+'>'+h(s)+'</option>'}).join('')+'</select></label>'
   +'<label class="f">件名<input id="ms" value="'+h(dr.件名)+'"></label><label class="f">本文（自由に直せます）<textarea id="mb">'+h(dr.本文)+'</textarea></label>'
   +'<div class="acts"><button class="btn" id="mno">今回は送らない</button><button class="btn pri" id="mgo">この内容でお客さまに送る</button></div>');
  var cur=dr.担当;
  $('#mt').onchange=function(){var nw=this.value,t=$('#mb').value;
    t=t.split('の'+cur+'です。').join('の'+nw+'です。').split('担当：'+cur).join('担当：'+nw);$('#mb').value=t;cur=nw;toast('担当者を「'+nw+'」に変えました')};
  $('#mno').onclick=function(){closeModal();toast('記録だけ保存しました（お客さまへは送っていません）')};
  $('#mgo').onclick=function(){var b=this;if(!$('#mb').value.trim()){toast('本文が空です');return}busy(b);
    call('sendReport',S.token,c.番号,$('#ms').value,$('#mb').value,st,$('#mt').value).then(function(){closeModal();toast('お客さまへ送信しました');reload()}).catch(fail)}}

// ---- 取次先への連絡文 ----
function referralModal(c,name,withContact,staff){
  call('draftReferral',S.token,c.番号,name,withContact,staff||$('#da')&&$('#da').value||c.担当者||'').then(function(dr){
    modal('<h3>取次先への連絡（下書き）</h3><p class="note">宛先：'+h(dr.取次先)+'（'+h(dr.宛先||'メール未登録')+'）</p>'
     +'<label class="f">送る担当者<select id="rt2">'+dr.担当一覧.map(function(s){return '<option'+(s===dr.担当?' selected':'')+'>'+h(s)+'</option>'}).join('')+'</select></label>'
     +'<label class="f" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="rcon" style="width:auto;margin:0"'+(dr.連絡先?' checked':'')+'> お客さまの連絡先（名前・メール・電話）を入れる　<small style="color:var(--red)">※お客さまの了承を得た場合だけ</small></label>'
     +'<label class="f">件名<input id="rs" value="'+h(dr.件名)+'"></label><label class="f">本文（自由に直せます）<textarea id="rb">'+h(dr.本文)+'</textarea></label>'
     +'<div class="acts"><button class="btn" data-close>今回は送らない</button><button class="btn pri" id="rgo"'+(dr.宛先?'':' disabled')+'>この内容で取次先に送る</button></div>');
    $('#rcon').onchange=function(){closeModal();referralModal(c,name,this.checked,$('#rt2').value)};
    var cur=dr.担当;$('#rt2').onchange=function(){var nw=this.value,t=$('#rb').value;t=t.split('の'+cur+'です。').join('の'+nw+'です。').split('担当：'+cur).join('担当：'+nw);$('#rb').value=t;cur=nw};
    $('#rgo').onclick=function(){var b=this;busy(b);call('sendReferral',S.token,c.番号,name,$('#rs').value,$('#rb').value,$('#rt2').value).then(function(){closeModal();toast('取次先へ送信しました');reload()}).catch(fail)}}).catch(fail)}

// ---- タブ ----
$$('.tabs button').forEach(function(b){b.onclick=function(){$$('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});$('#cases').classList.toggle('hide',b.dataset.tab!=='cases');$('#partners').classList.toggle('hide',b.dataset.tab!=='partners');if(b.dataset.tab==='partners')loadPartners()}});

// ---- 取次先の登録 ----
function loadPartners(){$('#ptlist').innerHTML='<div class="empty">読み込み中…</div>';call('getPartners',S.token).then(function(P){S.pt=P;
  if(!P.length){$('#ptlist').innerHTML='<div class="empty">まだ取次先が登録されていません。右上の「＋ 取次先を登録」から登録してください。</div>';return}
  $('#ptlist').innerHTML='<table class="pt-tbl"><thead><tr><th>取次先</th><th class="hm">対応分野</th><th class="hm">得意なこと・キーワード</th><th>連絡先</th><th class="hm">取次実績</th><th></th></tr></thead><tbody>'
   +P.map(function(p,i){return '<tr class="'+(p.有効?'':'off')+'"><td><b>'+h(p.名前)+'</b><small>'+h(p.種別||'')+(p.有効?'':'（停止中）')+'</small>'+(p.条件?'<small>条件：'+h(p.条件)+'</small>':'')+'</td><td class="hm">'+h(p.分野||'—')+'</td><td class="hm">'+h(p.キーワード||'—')+(p.地域?'<small>地域：'+h(p.地域)+'</small>':'')+'</td><td>'+h(p.担当者||'')+'<small>'+h(p.メール||'メール未登録')+'</small><small>'+h(p.電話||'')+'</small></td><td class="hm">'+p.実績.件数+' 件<small>完了 '+p.実績.完了+' 件</small></td><td><button class="btn sm" data-i="'+i+'">編集</button></td></tr>'}).join('')+'</tbody></table>';
  $$('#ptlist [data-i]').forEach(function(b){b.onclick=function(){partnerForm(S.pt[+b.dataset.i])}})}).catch(fail)}
$('#ptadd').onclick=function(){partnerForm(null)};
function partnerForm(p){p=p||{種別:'提携先',有効:true};
  modal('<h3>'+(p.行?'取次先の編集':'取次先の登録')+'</h3>'
   +'<div class="grid2"><label class="f">取次先名（必須）<input id="p_n" value="'+h(p.名前||'')+'"></label><label class="f">種別<select id="p_k">'+['提携先','有資格者','許可事業者','自社'].map(function(s){return '<option'+(s===p.種別?' selected':'')+'>'+s+'</option>'}).join('')+'</select></label></div>'
   +'<div class="grid2"><label class="f">担当者名<input id="p_p" value="'+h(p.担当者||'')+'"></label><label class="f">電話<input id="p_t" value="'+h(p.電話||'')+'"></label></div>'
   +'<label class="f">メール（取次の連絡文の送り先）<input id="p_m" type="email" value="'+h(p.メール||'')+'"></label>'
   +'<label class="f">対応分野（ホームページの事業名を「、」で区切る。全部なら「すべて」）<input id="p_a" value="'+h(p.分野||'')+'" placeholder="例）家じまい・不動産支援、リユース・買取"></label>'
   +'<div class="chiprow" id="p_ac"></div>'
   +'<label class="f">得意なこと・キーワード（「、」で区切る。お問い合わせの言葉と照らし合わせます）<textarea id="p_w" rows="2" placeholder="例）遺品整理、空き家管理、不用品回収、解体">'+h(p.キーワード||'')+'</textarea></label>'
   +'<div class="grid2"><label class="f">対応地域<input id="p_r" value="'+h(p.地域||'')+'" placeholder="例）大阪、兵庫、京都"></label><label class="f">手数料・条件<input id="p_c" value="'+h(p.条件||'')+'" placeholder="例）成約額の10％"></label></div>'
   +'<label class="f">メモ<textarea id="p_o" rows="2">'+h(p.メモ||'')+'</textarea></label>'
   +'<label class="f" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="p_e" style="width:auto;margin:0"'+(p.有効!==false?' checked':'')+'> 利用する（外すと候補に出なくなります）</label>'
   +'<p class="err" id="p_err"></p><div class="acts"><button class="btn" data-close>やめる</button><button class="btn pri" id="p_ok">保存する</button></div>');
  var MIDS=['企業支援・経営サポート','専門家連携・行政書士業務','人材・採用支援','事業連携・協業','新規事業開発','通信・電話関連','店舗運営支援','固定費・仕入れ削減','衛生・環境関連商材','商材開拓・代理店展開','海外・輸出・国際ネットワーク','地域活性化','企画・制作・プロデュース','AI・システム開発','リユース・買取','家じまい・不動産支援','医療・介護 総合支援','すべて'];
  var drawA=function(){var cur=$('#p_a').value.split(/[、,]/).map(function(x){return x.trim()}).filter(Boolean);
    $('#p_ac').innerHTML=MIDS.map(function(m){return '<button type="button" class="'+(cur.indexOf(m)>=0?'on':'')+'">'+h(m)+'</button>'}).join('');
    $$('#p_ac button').forEach(function(b){b.onclick=function(){var t=b.textContent,i=cur.indexOf(t);i>=0?cur.splice(i,1):cur.push(t);$('#p_a').value=cur.join('、');drawA()}})};
  drawA();$('#p_a').oninput=drawA;
  $('#p_ok').onclick=function(){var b=this;busy(b);call('savePartner',S.token,{行:p.行||0,名前:$('#p_n').value,種別:$('#p_k').value,担当者:$('#p_p').value,電話:$('#p_t').value,メール:$('#p_m').value,分野:$('#p_a').value,キーワード:$('#p_w').value,地域:$('#p_r').value,条件:$('#p_c').value,メモ:$('#p_o').value,有効:$('#p_e').checked}).then(function(r){unbusy(b);if(!r.ok){$('#p_err').textContent=r.error;return}closeModal();toast('取次先を保存しました');loadPartners();load(false)}).catch(function(e){unbusy(b);$('#p_err').textContent=e.message})}}

// ログイン済みなら、そのまま開く
if(S.token)start();
})();
</script>
</body>
</html>
